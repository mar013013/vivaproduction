<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Общий свадебный бюджет, гости, покупки и чат Марата и Карины.">
  <title>Свадьба — Марат & Карина</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="apple.css?v=1">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Разделы приложения">
      <button class="brand" data-route="dashboard" aria-label="Главная">
        <span class="brand-mark">M<span>♥</span>K</span>
        <span class="brand-copy"><strong>Марат и Карина</strong><small>25 августа 2026</small></span>
      </button>

      <nav class="side-nav">
        <button class="nav-item active" data-route="dashboard"><span class="nav-icon" data-icon="home"></span><b>Обзор</b></button>
        <button class="nav-item" data-route="expenses"><span class="nav-icon" data-icon="wallet"></span><b>Расходы</b></button>
        <button class="nav-item" data-route="guests"><span class="nav-icon" data-icon="people"></span><b>Гости</b></button>
        <button class="nav-item" data-route="purchases"><span class="nav-icon" data-icon="check"></span><b>Покупки</b></button>
        <button class="nav-item" data-route="chat"><span class="nav-icon" data-icon="message"></span><b>Чат</b><i id="chatBadge" hidden></i></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="date-card"><small>До свадьбы</small><strong id="sideCountdown">—</strong></div>
        <button class="nav-item compact" data-route="settings"><span class="nav-icon" data-icon="settings"></span><b>Настройки</b></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p id="pageEyebrow">СВАДЬБА МАРАТА И КАРИНЫ</p>
          <h1 id="pageTitle">Обзор</h1>
        </div>
        <div class="top-actions">
          <button class="circle-button" id="themeButton" aria-label="Сменить тему"><span data-icon="moon"></span></button>
          <button class="circle-button" data-route="settings" aria-label="Настройки"><span data-icon="settings"></span></button>
          <button class="primary-button" id="headerAdd"><span data-icon="plus"></span><span>Добавить</span></button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" aria-label="Мобильная навигация">
      <button class="active" data-mobile-route="dashboard"><span data-icon="home"></span><small>Обзор</small></button>
      <button data-mobile-route="expenses"><span data-icon="wallet"></span><small>Расходы</small></button>
      <button data-mobile-route="guests"><span data-icon="people"></span><small>Гости</small></button>
      <button data-mobile-route="chat"><span data-icon="message"></span><small>Чат</small></button>
      <button data-mobile-route="purchases"><span data-icon="check"></span><small>Покупки</small></button>
    </nav>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="assertive"></div>
  <div id="modalRoot" class="modal-root"></div>
  <input type="file" id="importInput" accept="application/json" hidden>
  <script src="sync-bootstrap.js?v=4"></script>
</body>
</html>
