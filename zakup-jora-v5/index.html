<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11140f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Zakup Jora"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Zakup Jora</title><style>html,body{margin:0;height:100%;background:#11140f;color:#b9ff59;font-family:-apple-system,sans-serif}body{display:grid;place-items:center}.l{text-align:center}.l b{display:grid;place-items:center;width:62px;height:62px;margin:auto;border-radius:20px;background:#1d221a;font:700 35px Georgia}.l span{display:block;margin-top:12px;color:#fff;font-size:12px}</style></head><body><div class="l"><b>J</b><span>Открываем Zakup Jora…</span></div><script>(async()=>{const n=["part1.txt", "part2.txt", "part3.txt", "part4.txt"];const x=await Promise.all(n.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()})));const b=atob(x.join('').replace(/\s/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const h=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()})().catch(()=>document.body.innerHTML='<div class="l"><b>J</b><span>Обновите страницу при наличии интернета</span></div>')</script></body></html>
