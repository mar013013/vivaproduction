<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Истории · Фруктодар</title><link rel="stylesheet" href="style.css?v=2"><link rel="stylesheet" href="stories.css?v=2"></head><body class="owner-page"><main><a class="text-link" href="./">← Вернуться в магазин</a><h1>Истории Фруктодара</h1><p>Фото и видео до 15 секунд. Каждая публикация видна покупателям 24 часа.</p><form id="ownerLogin" class="owner-panel"><label for="ownerToken">Ключ владельца</label><input id="ownerToken" type="password" autocomplete="off" required><button class="button dark" type="submit">Подключиться</button><p>Ключ хранится только в памяти этой страницы. Его задают на сервере при подключении историй.</p></form><form id="ownerUpload" class="owner-panel" hidden><label for="storyTitle">Название</label><input id="storyTitle" maxlength="80" required placeholder="Например, манго сегодня"><label for="storyFile">Фото или видео</label><input id="storyFile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" required><p>До 25 МБ. Видео до 15 секунд. Файл будет виден всем покупателям сайта.</p><button class="button dark" id="publishStory" type="submit">Опубликовать на 24 часа</button><button class="button light" id="ownerLogout" type="button">Выйти</button></form><p id="ownerStatus" role="status"></p><div id="ownerStories" class="owner-stories"></div></main><script src="stories-config.js?v=2"></script><script src="admin.js?v=2"></script></body></html>
