<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee7">
<title>Марат & Карина — 25 августа 2026</title>
<style>
html,body{margin:0;height:100%;background:#f6efe7;color:#6e5b4f;font-family:Georgia,serif}
.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.loading b{display:block;font-size:44px;font-weight:400;margin-bottom:14px}
.loading span{font:10px system-ui;letter-spacing:.28em;text-transform:uppercase}
</style>
</head>
<body>
<div class="loading"><div><b>Марат & Карина</b><span>открываем приглашение…</span></div></div>
<script>
Promise.all([
 fetch('parts/html01.txt').then(r=>{if(!r.ok)throw Error('html01');return r.text()}),
 fetch('parts/html02.txt').then(r=>{if(!r.ok)throw Error('html02');return r.text()}),
 fetch('parts/img01.txt').then(r=>{if(!r.ok)throw Error('img01');return r.text()}),
 fetch('parts/img02.txt').then(r=>{if(!r.ok)throw Error('img02');return r.text()}),
 fetch('parts/img03.txt').then(r=>{if(!r.ok)throw Error('img03');return r.text()}),
 fetch('parts/img04.txt').then(r=>{if(!r.ok)throw Error('img04');return r.text()})
]).then(([a,b,i1,i2,i3,i4])=>{
 const image=(i1+i2+i3+i4).replace(/\s/g,'');
 const page=(a+b).replaceAll('__HERO__','data:image/webp;base64,'+image);
 document.open();document.write(page);document.close();
}).catch(()=>{
 document.body.innerHTML='<div class="loading"><div><b>Марат & Карина</b><span>обновите страницу</span></div></div>';
});
</script>
</body>
</html>
