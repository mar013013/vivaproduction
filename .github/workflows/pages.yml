name: Deploy Wedding Budget to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "wedding-budget/**"
      - "central-bank/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare both applications
        run: |
          mkdir -p _site/central-bank
          cp -a wedding-budget/. _site/
          cp -a central-bank/. _site/central-bank/
          python3 central-bank/export.py _site/central-bank/central-bank.html

      - name: Upload applications
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
