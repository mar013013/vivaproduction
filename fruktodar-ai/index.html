<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d120d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fruktodar AI"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Fruktodar AI</title><style>html,body{margin:0;height:100%;background:#0b0f0b;color:#b8ff58;font-family:-apple-system,sans-serif}body{display:grid;place-items:center}.l{text-align:center}.l b{display:grid;place-items:center;width:64px;height:64px;margin:auto;border-radius:20px;background:#b8ff58;color:#0b0f0b;font:900 36px Georgia}.l span{display:block;margin-top:13px;color:#fff;font-size:12px}</style></head><body><div class="l"><b>F</b><span>Открываем Fruktodar AI…</span></div><script>(async()=>{const n=["part1.txt","part2.txt","part3.txt","part4.txt"];const x=await Promise.all(n.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()})));const b=atob(x.join('').replace(/\s/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const h=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()})().catch(()=>document.body.innerHTML='<div class="l"><b>F</b><span>Обновите страницу при наличии интернета</span></div>')</script></body></html>
