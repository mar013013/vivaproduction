<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121510"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Zakup Jora"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Zakup Jora</title><style>html,body{margin:0;height:100%;background:#121510;color:#baff59;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{display:grid;place-items:center}.l{text-align:center}.l b{display:block;font-size:42px}.l span{display:block;margin-top:8px;color:#fff;font-size:12px}</style></head><body><div class="l"><b>J</b><span>Открываем Zakup Jora…</span></div><script>(async()=>{const names=['part1.txt','part2.txt','part3.txt','part4.txt'];const xs=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw Error(n);return r.text()})));const b=atob(xs.join('').replace(/\s/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const t=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(()=>document.body.innerHTML='<div class="l"><b>J</b><span>Обновите страницу</span></div>');</script></body></html>
